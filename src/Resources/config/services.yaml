parameters:

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      $cookieCategories: '%nowo_cookie_consent.categories%'
      $formAction: '%nowo_cookie_consent.form_action%'
      $csrfProtection: '%nowo_cookie_consent.csrf_protection%'
      $cookieConsentDisabledRoutes: '%nowo_cookie_consent.disabled_routes%'
      $skipRenderRoutes: '%nowo_cookie_consent.skip_render_routes%'
      $renderRoutes: '%nowo_cookie_consent.render_routes%'
      $useDatabaseConfig: '%nowo_cookie_consent.use_database_config%'
      $fetchConfigViaApi: '%nowo_cookie_consent.fetch_config_via_api%'
      $uiTheme: '%nowo_cookie_consent.ui_theme%'

  Nowo\CookieConsentBundle\:
    resource: '../../'
    exclude:
      - '../../Controller/'
      - '../../DependencyInjection/'
      - '../../Entity/'
      - '../../Doctrine/'
      - '../../NowoCookieConsentBundle.php'
      - '../../EventSubscriber/CookieConsentAdminAccessSubscriber.php'
      - '../../Security/AllowAllCookieConsentAccessChecker.php'
      - '../../Security/ConfigurableCookieConsentAccessChecker.php'
      - '../../Clock/'
      - '../../Cookie/ConsentCookie.php'
      - '../../Cookie/ConsentCookieJar.php'
      - '../../Cookie/ConsentRequestCookies.php'
      - '../../Http/ConsentCookieJarApplier.php'
      - '../../Http/ConsentCookieResponseWriter.php'
      - '../../Event/'
      - '../../Locale/ConfiguredLocales.php'
      - '../../PersonalData/'
      # 1.36: registered by the extension (DoctrineBundle only); value objects are not services.
      - '../../Provisioning/'
      # 1.31: registered by the extension (conflict_response options).
      - '../../EventListener/CookieConsentConflictListener.php'
      # 1.34: registered by the extension with doctrine.private_entity_manager: true only.
      - '../../EventSubscriber/CookieConsentPrivateManagerBoundarySubscriber.php'

  Nowo\CookieConsentBundle\Clock\SystemClock: ~

  Psr\Clock\ClockInterface:
    alias: Nowo\CookieConsentBundle\Clock\SystemClock

  Nowo\CookieConsentBundle\Cookie\CookieHandler:
    arguments:
      $httpOnly: '%nowo_cookie_consent.http_only%'
      $clock: '@Psr\Clock\ClockInterface'

  Nowo\CookieConsentBundle\EventSubscriber\CookieConsentSchemaReadySubscriber:
    arguments:
      $clock: '@Psr\Clock\ClockInterface'
      $schemaReadyCacheTtl: '%nowo_cookie_consent.schema_ready_cache_ttl%'
      $tablePrefix: '%nowo_cookie_consent.doctrine.table_prefix%'

  Nowo\CookieConsentBundle\Cookie\CookieLogger:
    arguments:
      $clock: '@Psr\Clock\ClockInterface'
      $logger: '@?logger'
      $managerRegistry: '@?doctrine'

  # Explicit (not _defaults.bind): survives setClass overrides and avoids unused-bind
  # errors when the FormSubscriber definition is replaced by the host app.
  Nowo\CookieConsentBundle\EventSubscriber\CookieConsentFormSubscriber:
    arguments:
      $useLogger: '%nowo_cookie_consent.use_logger%'
      $eventDispatcher: '@?event_dispatcher'
      $clock: '@Psr\Clock\ClockInterface'
      $conflicts: '@?Nowo\CookieConsentBundle\EventListener\CookieConsentConflictListener'

  # Documented API (1.26, DDD P2): type-hint the interfaces; alias them to your own service to replace one.
  Nowo\CookieConsentBundle\Cookie\CookieCheckerInterface:
    alias: Nowo\CookieConsentBundle\Cookie\CookieChecker

  # The consent cookie port (1.30, REQ-ARCH-001 rule 3; the only one since 2.0): alias it to your own writer, or
  # decorate nowo_cookie_consent.cookie_writer. A separate definition from CookieHandler (audit MR-C-M1);
  # ConsentCookieWriterPass refuses the removed CookieHandlerInterface and a decorated or replaced CookieHandler.
  nowo_cookie_consent.cookie_writer:
    class: Nowo\CookieConsentBundle\Cookie\CookieHandler
    arguments:
      $httpOnly: '%nowo_cookie_consent.http_only%'
      $clock: '@Psr\Clock\ClockInterface'

  Nowo\CookieConsentBundle\Cookie\ConsentCookieWriterInterface:
    alias: nowo_cookie_consent.cookie_writer

  Nowo\CookieConsentBundle\Cookie\CookieLoggerInterface:
    alias: Nowo\CookieConsentBundle\Cookie\CookieLogger

  # Read port over the enabled consent profiles (1.34, REQ-ARCH-001 rules 1 and 3): view objects and ids, no entity.
  Nowo\CookieConsentBundle\Config\CookieConsentConfigReaderInterface:
    alias: Nowo\CookieConsentBundle\Config\CookieConsentConfigReader

  # GDPR erasure / export ports of the consent log (1.29): documented API, type-hint the interfaces.
  Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataEraser:
    arguments:
      $managerRegistry: '@doctrine'
      $eventDispatcher: '@?event_dispatcher'
      $clock: '@Psr\Clock\ClockInterface'

  Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataExporter:
    arguments:
      $managerRegistry: '@doctrine'

  # REQ-SEC-006 (1.30.2): binary NO PAD collation on cookie_consent_key / ip_address (MySQL / MariaDB schemas).
  Nowo\CookieConsentBundle\Doctrine\ConsentLogCollationListener:
    arguments:
      $doctrine: '@doctrine'
      $logger: '@?logger'
    tags:
      - { name: doctrine.event_listener, event: postGenerateSchema }

  Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataEraserInterface:
    alias: Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataEraser

  Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataExporterInterface:
    alias: Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataExporter

  Nowo\CookieConsentBundle\PersonalData\IpWindowSubjectResolver:
    arguments:
      $providers: !tagged_iterator nowo_cookie_consent.personal_data.ip_window_provider
      $margin: '%nowo_cookie_consent.personal_data.ip_window_margin%'

  Nowo\CookieConsentBundle\PersonalData\CookieConsentPersonalDataSubjectResolverInterface:
    alias: Nowo\CookieConsentBundle\PersonalData\IpWindowSubjectResolver

  Nowo\CookieConsentBundle\Locale\LocaleResolver:
    arguments:
      $enabledLocales: '%nowo_cookie_consent.enabled_locales%'
      $defaultLocale: '%nowo_cookie_consent.default_locale%'
      $detectLocaleFromAcceptLanguage: '%nowo_cookie_consent.detect_locale_from_accept_language%'

  Nowo\CookieConsentBundle\Config\CmpUxOptionsResolver:
    arguments:
      $colorTheme: '%nowo_cookie_consent.color_theme%'
      $darkModeEnabled: '%nowo_cookie_consent.dark_mode_enabled%'
      $disableTransitions: '%nowo_cookie_consent.disable_transitions%'
      $disablePageInteraction: '%nowo_cookie_consent.disable_page_interaction%'
      $twoStepModal: '%nowo_cookie_consent.two_step_modal%'
      $openPreferencesModal: '%nowo_cookie_consent.open_preferences_modal%'
      $manageIframePlaceholders: '%nowo_cookie_consent.manage_iframe_placeholders%'
      $granularCookieSelection: '%nowo_cookie_consent.granular_cookie_selection%'
      $preferencesBubbleEnabled: '%nowo_cookie_consent.preferences_bubble_enabled%'
      $preferencesBubblePosition: '%nowo_cookie_consent.preferences_bubble_position%'
      $preferencesBubbleBorderColor: '%nowo_cookie_consent.preferences_bubble_border_color%'
      $preferencesBubbleIcon: '%nowo_cookie_consent.preferences_bubble_icon%'
      $yamlPreferenceSections: '%nowo_cookie_consent.preference_sections%'
      $useDatabaseConfig: '%nowo_cookie_consent.use_database_config%'

  Nowo\CookieConsentBundle\Config\CookieInventoryProvider:
    arguments:
      $useCookieInventory: '%nowo_cookie_consent.use_cookie_inventory%'
      $yamlCookieInventory: '%nowo_cookie_consent.cookie_inventory%'

  Nowo\CookieConsentBundle\Twig\CookieConsentTranslationTwigExtension:
    arguments:
      $privacyRouteFallback: '%nowo_cookie_consent.privacy_route%'
      $urlGenerator: '@?router'
      $logger: '@?logger'

  Nowo\CookieConsentBundle\Twig\CookieConsentTwigExtension:
    arguments:
      $yamlRouteTargetingMode: '%nowo_cookie_consent.route_targeting_mode%'
      $yamlTargetRoutes: '%nowo_cookie_consent.target_routes%'
      $useDatabaseConfig: '%nowo_cookie_consent.use_database_config%'
      $fetchConfigViaApi: '%nowo_cookie_consent.fetch_config_via_api%'
      $cookieConsentDisabledRoutes: '%nowo_cookie_consent.disabled_routes%'
      $cmpUxOptionsResolver: '@Nowo\CookieConsentBundle\Config\CmpUxOptionsResolver'
      $inventoryProvider: '@Nowo\CookieConsentBundle\Config\CookieInventoryProvider'

  Nowo\CookieConsentBundle\Config\CookieConsentConfigPayloadFactory:
    arguments:
      $categories: '%nowo_cookie_consent.categories%'
      $yamlPreferenceSections: '%nowo_cookie_consent.preference_sections%'
      $disablePageInteraction: '%nowo_cookie_consent.disable_page_interaction%'
      $privacyRouteFallback: '%nowo_cookie_consent.privacy_route%'

  # Controllers are not autoconfigured (REQ-SF-004 rule 7): on Symfony >= 7.3 autoconfiguration tags every #[Route]
  # class with `routing.controller`, and the host's default `routing.controllers` resource would then load the bundle
  # routes without the host importing routing.yaml. The tags autoconfiguration gave them are set explicitly instead.
  Nowo\CookieConsentBundle\Controller\:
    resource: '../../Controller/'
    exclude:
      - '../../Controller/CookieConsentConfigSettingsAdminController.php'
      - '../../Controller/CookieDefinitionAdminController.php'
    public: true
    autoconfigure: false
    tags: ['controller.service_arguments']

  # AbstractController subclasses: their service locator ($this->container) comes from container.service_subscriber.
  Nowo\CookieConsentBundle\Controller\CookieConsentConfigSettingsAdminController:
    public: true
    autoconfigure: false
    tags: ['controller.service_arguments', 'container.service_subscriber']

  Nowo\CookieConsentBundle\Controller\CookieDefinitionAdminController:
    public: true
    autoconfigure: false
    tags: ['controller.service_arguments', 'container.service_subscriber']

  Nowo\CookieConsentBundle\Entity\CookieConsentLog:
    autowire: false

  nowo_cookie_consent.translation.loader.array:
    class: Symfony\Component\Translation\Loader\ArrayLoader
    tags:
      - { name: translation.loader, alias: array }

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\CookieConsentBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']

  # REQ-UI-003 view models of the admin pages.
  Nowo\CookieConsentBundle\Admin\AdminPageFactory:
    arguments:
      $layoutTemplate: '%nowo_cookie_consent.web_ui.layout_template%'
      $templates: '%nowo_cookie_consent.web_ui.templates%'
