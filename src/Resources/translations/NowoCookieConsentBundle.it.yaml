nowo_cookie_consent.admin.config.settings.fields.reconsent: 'Chiedere di nuovo il consenso ai visitatori?'
nowo_cookie_consent.admin.config.settings.fields.reconsent_help: 'Obbligatorio quando cambia la revisione. Sì per modifiche rilevanti (nuove finalità, categorie o fornitori): chi aveva già acconsentito viene interpellato di nuovo e, finché non risponde, si applicano solo i cookie necessari. No per modifiche minori (refusi, formulazione): i consensi salvati restano validi. L''ultima nuova richiesta risale al %date%.'
nowo_cookie_consent.admin.config.settings.fields.reconsent_help_never: 'Obbligatorio quando cambia la revisione. Sì per modifiche rilevanti (nuove finalità, categorie o fornitori): chi aveva già acconsentito viene interpellato di nuovo e, finché non risponde, si applicano solo i cookie necessari. No per modifiche minori (refusi, formulazione): i consensi salvati restano validi. Per questo profilo il consenso non è mai stato richiesto di nuovo.'
