nowo_cookie_consent.admin.config.settings.fields.reconsent_help_never: 'Obrigatório quando altera a revisão. Sim para alterações relevantes (novas finalidades, categorias ou fornecedores): todos os que já consentiram são questionados de novo e, até responderem, só se aplicam os cookies necessários. Não para alterações menores (gralhas, redação): os consentimentos guardados mantêm-se. Nunca se voltou a perguntar aos visitantes deste perfil.'
