nowo_cookie_consent:
    table_prefix: 'demo_tailwind_'
    ui_theme: tailwind
    use_logger: true
    use_database_config: true
    use_cookie_inventory: true
    fetch_config_via_api: true
    default_locale: en
    enabled_locales:
        - en
        - es
        - it
        - fr
        - de
        - pt
        - nl
        - pl
        - ca
    detect_locale_from_accept_language: false
    categories:
        - functionality
        - analytics
        - marketing
        - preferences
    web_ui:
        enabled: true
        path_prefix: /cookie-consent-config
        css_framework: tailwind
        list_page_size: 20
    # DEMO ONLY — production hosts must keep allow_unauthenticated: false and protect the admin prefix.
    security:
        allow_unauthenticated: true
        access_roles: [ROLE_ADMIN]
