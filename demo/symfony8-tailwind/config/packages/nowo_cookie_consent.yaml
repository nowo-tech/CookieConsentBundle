nowo_cookie_consent:
    doctrine:
        table_prefix: 'demo_tailwind_'
    ui_theme: tailwind
    use_logger: true
    use_database_config: true
    use_cookie_inventory: true
    fetch_config_via_api: true
    default_locale: en
    # Same list as framework.enabled_locales (an env var also works: '%env(json:APP_LOCALES)%').
    enabled_locales: '%kernel.enabled_locales%'
    detect_locale_from_accept_language: false
    # The bundle admin pages (UiKit layout) never render the consent banner.
    skip_render_routes:
        - 'nowo_cookie_consent_cookie_definitions_*'
        - 'nowo_cookie_consent_config_settings_*'
    categories:
        - functionality
        - analytics
        - marketing
        - preferences
    web_ui:
        enabled: true
        list_page_size: 10
    # DEMO ONLY — production hosts must keep allow_unauthenticated: false and protect the admin prefix.
    security:
        allow_unauthenticated: true
        access_roles: [ROLE_ADMIN]
