# REQ-DEMO-014: UiKit's default theme, unchanged (no theme tokens, no CSS framework, no CDN, no host classes).
# REQ-UI-003: the bundle admin pages (/cookie-consent-config/{id}/cookies|settings) render inside the demo base layout,
# which extends UiKit's demo platform shell.
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
