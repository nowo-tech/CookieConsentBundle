# REQ-UI-003: the bundle admin pages (/cookie-consent-config/{id}/cookies|settings) render in the demo host layout
# (one-file bridge into base.html.twig, Bootstrap 5 from the demo) and are themed once here, like every Nowo bundle.
nowo_ui_kit:
    css_framework: bootstrap5
    icon_set: bootstrap-icons
    row_actions_display: icon
    layouts:
        admin: 'admin/layout.html.twig'
    theme:
        tokens:
            primary: '#0d6efd'
            radius: '0.5rem'
        classes:
            table_wrap: 'card shadow-sm'
            form_panel: 'card card-body shadow-sm'
            section: 'shadow-sm'
        attributes:
            table: { data-demo-table: 'cookie-consent' }
